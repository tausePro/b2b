<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#9CBB06">
  <title>Sin conexión · Imprima B2B</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a; }
    main { max-width: 26rem; padding: 2rem; text-align: center; }
    img { width: 72px; height: 72px; }
    h1 { font-size: 1.4rem; margin: 1rem 0 .5rem; }
    p { color: #475569; line-height: 1.5; margin: 0 0 1.5rem; }
    button { min-height: 44px; padding: .6rem 1.4rem; border: 0; border-radius: .6rem; background: #9CBB06; color: #0f172a; font-weight: 700; font-size: 1rem; cursor: pointer; }
    button:focus-visible { outline: 3px solid #0f172a; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <img src="/pwa/icon-192.png" alt="" width="72" height="72">
    <h1>No hay conexión</h1>
    <p>El portal necesita internet para consultar pedidos, precios e inventario en tiempo real. Revisa tu conexión e inténtalo de nuevo.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
